name: Flutter CI

on:
  push:
    branches: [main, develop, "feature/**", "fix/**"]
  pull_request:
    branches: [main, develop]

# Cancel in-progress runs for the same branch on new pushes.
concurrency:
  group: flutter-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: "3.44.6"

jobs:
  # ── Unit + Contract tests ────────────────────────────────────────────────────
  unit-and-contract:
    name: Unit & Contract Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: .

    steps:
      - uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Run unit tests with coverage
        run: flutter test test/core test/features test/integration test/widget_test.dart --coverage
        env:
          # Contract tests: fixtures are loaded from disk (no network call needed)
          CI: "true"

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-report
          path: coverage/lcov.info
          retention-days: 14

  # ── Contract tests (separate step for clear reporting) ──────────────────────
  contract:
    name: API Contract Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: .

    steps:
      - uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Run contract tests
        # Fixtures live in test/contracts/fixtures/ (committed to git).
        # No network calls — pure deserialization checks.
        run: flutter test test/contracts/

  # ── Golden visual tests ──────────────────────────────────────────────────────
  golden:
    name: Golden Visual Tests
    runs-on: windows-latest
    defaults:
      run:
        working-directory: .

    steps:
      - uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Run golden tests
        run: flutter test test/goldens/

      - name: Upload golden diffs on failure
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: golden-failures
          path: test/goldens/failures/
          retention-days: 7

  # ── Lint ──────────────────────────────────────────────────────────────────────
  lint:
    name: Flutter Analyze
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: .

    steps:
      - uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

  # ── Offline stress tests ─────────────────────────────────────────────────────
  stress:
    name: Offline Stress Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: .

    steps:
      - uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Run offline stress tests
        run: flutter test test/stress/

  # ── Web build ────────────────────────────────────────────────────────────────
  # Nothing above compiles for the web. That is how the firebase_core ^4.14.0
  # bump (40b27ca) left the web POS unbuildable for a day: firebase_core_web is
  # web-only, so every Android job stayed green while `flutter build web` failed
  # on a package that needed a newer Dart. This job runs the SAME script that
  # deploy_web.ps1 runs - not a bare `flutter build web` - so it proves the exact
  # artifact the deploy ships: the release compile, the web push config, and the
  # locally bundled Firebase compat scripts.
  web-build:
    name: Web Build (staging)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: .

    steps:
      - uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      # Invoked through bash: the script is tracked without an exec bit.
      - name: Build web release the way deploy_web.ps1 does
        run: bash scripts/build_release.sh staging web

      - name: Assert the deployable artifact is complete
        run: |
          set -euo pipefail
          for f in build/web/main.dart.js                    build/web/flutter_bootstrap.js                    build/web/firebase-web-config.js                    build/web/firebase-app-compat.js                    build/web/firebase-messaging-compat.js; do
            test -s "$f" || { echo "missing or empty: $f" >&2; exit 1; }
          done
          echo "main.dart.js: $(stat -c %s build/web/main.dart.js) bytes"

      # The web-push interop files only compile for the web, so the VM suite
      # above never executes them - an interop change can pass analysis and
      # every test while being broken at runtime. These run in the real Chrome
      # that ubuntu-latest ships, so the JS interop is exercised, not just typed.
      - name: Browser interop tests (Chrome)
        run: flutter test --platform chrome test/features/pos/order_alert/web/
